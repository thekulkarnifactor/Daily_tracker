<header class="topbar">
  <div class="topbar-left">
    <a class="brand" href="{{ url_for('main.dashboard') }}"><span class="brand-mark"></span> Daily Tracker</a>
    <nav class="nav">
      <a href="{{ url_for('main.dashboard') }}" {% if active == 'calendar' %}aria-current="page"{% endif %}>Calendar</a>
      <a href="{{ url_for('tpl.templates') }}" {% if active == 'templates' %}aria-current="page"{% endif %}>Templates</a>
      <a href="{{ url_for('tpl.month_template') }}" {% if active == 'month' %}aria-current="page"{% endif %}>Month sheet</a>
    </nav>
  </div>
  <div class="topbar-right">
    <span class="source" title="Data source">
      <span class="dot dot-ok"></span>
      {% if backend == 'sheets' %}Google Sheet{% else %}Excel file{% endif %}{% if tab is defined and tab %} · tab <b>{{ tab }}</b>{% endif %}
    </span>
    <form method="post" action="{{ url_for('main.sync') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-ghost" type="submit" title="Reload changes made directly in the sheet">↻ Sync</button>
    </form>
    <div class="user">
      {% if user.picture %}<img src="{{ user.picture }}" alt="" referrerpolicy="no-referrer">{% endif %}
      <span class="user-email">{{ user.email }}</span>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-ghost btn-sm" type="submit">Sign out</button>
      </form>
    </div>
  </div>
</header>

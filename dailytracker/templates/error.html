{% extends "base.html" %}
{% block title %}{{ title }} · Daily Tracker{% endblock %}
{% block body_class %}page-center{% endblock %}
{% block content %}
<main class="login-card">
  <div class="error-code">{{ code }}</div>
  <h1>{{ title }}</h1>
  {% if message %}<p class="muted">{{ message }}</p>{% endif %}
  <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Back to tracker</a>
</main>
{% endblock %}
